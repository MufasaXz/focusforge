<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FocusForge — an open-source, privacy-first study companion with app shielding, focus timers, analytics and gamification.">
  <!-- Two theme colours, one per scheme. The browser picks by
       prefers-color-scheme, which is the same signal the app follows. -->
  <meta name="theme-color" content="#FFF8F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181210" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FocusForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FocusForge</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Match the app canvas so there is no flash of the wrong theme while the
       engine boots. The colours are the theme's own surface roles, and the
       scheme follows the device the same way the app does. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFF8F6;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #181210; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
