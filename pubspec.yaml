name: focusforge
description: "FocusForge — an open-source, privacy-first study companion with app shielding, focus timers, analytics and gamification."
publish_to: 'none'
version: 1.0.0+2023

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  # Optional account, private group aggregates and the opt-in weekly board.
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  # Private study and badge backups; optional study-group/board summaries.
  cloud_firestore: ^5.5.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.4
  # Permissions — real system dialogs, not local state.
  #
  # No `app_settings`: the guide lists it for opening system settings pages,
  # but `permission_handler` already exposes `openAppSettings()` and the two
  # Android plugins below open their own pages, so it would be a third route
  # to the same two screens. Its pinned release also hardcodes
  # `compileSdkVersion 33`, which cannot build against the AndroidX versions
  # the rest of the graph pulls in.
  # No `flutter_accessibility_service`: the shield runs on its own native
  # `AccessibilityService`, which is the only way to keep blocking alive when
  # the Flutter engine is not. The plugin's listener also dropped every event
  # whose source node was null, which is most of them, so it could never have
  # reported a block even when it was installed correctly.
  permission_handler: ^11.3.1
  # Upstream 2.0.1 with its Android build migrated to AGP built-in Kotlin.
  usage_stats:
    path: third_party/usage_stats
  just_audio: ^0.9.41
  # Only for `Blend.harmonize`, which rotates the categorical subject, tier and
  # persona colours into the live theme's temperature.
  material_color_utilities: ^0.13.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  image: ^4.12.0
dev_dependencies:
  shared_preferences_platform_interface: ^2.4.1
  cloud_firestore_platform_interface: ^6.6.12
  firebase_core_platform_interface: ^6.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: FocusDial
      fonts:
        - asset: assets/fonts/FocusDial-Regular.ttf
          weight: 400
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
