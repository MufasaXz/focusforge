name: focusforge
description: "FocusForge — an open-source, privacy-first study companion with app shielding, focus timers, analytics and gamification."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Accounts that survive a reinstall, and the seam for the future
  # study-groups/leaderboard backend (auth profiles only, never usage data).
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  # Permissions — real system dialogs, not local state.
  #
  # No `app_settings`: the guide lists it for opening system settings pages,
  # but `permission_handler` already exposes `openAppSettings()` and the two
  # Android plugins below open their own pages, so it would be a third route
  # to the same two screens. Its pinned release also hardcodes
  # `compileSdkVersion 33`, which cannot build against the AndroidX versions
  # the rest of the graph pulls in.
  permission_handler: ^11.3.1
  flutter_accessibility_service: ^0.3.0
  usage_stats: ^2.0.1
  just_audio: ^0.9.41
  # UI
  fl_chart: ^0.70.2
  material_color_utilities: ^0.13.0
  material_3_expressive: ^1.1.5
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
