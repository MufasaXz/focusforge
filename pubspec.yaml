name: focusforge
description: "FocusForge — an open-source, privacy-first study companion with app shielding, focus timers, analytics and gamification."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # No Firebase and no Google sign-in on this branch: F-Droid's inclusion
  # policy forbids proprietary Google libraries outright, and the app's
  # account seam already has a complete on-device implementation — see
  # `LocalAuthService` in lib/core/services/auth_service.dart. The main
  # branch keeps the Firebase backend for the Play build.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  # Permissions — real system dialogs, not local state.
  #
  # No `app_settings`: the guide lists it for opening system settings pages,
  # but `permission_handler` already exposes `openAppSettings()` and the two
  # Android plugins below open their own pages, so it would be a third route
  # to the same two screens. Its pinned release also hardcodes
  # `compileSdkVersion 33`, which cannot build against the AndroidX versions
  # the rest of the graph pulls in.
  # No `flutter_accessibility_service`: the shield runs on its own native
  # `AccessibilityService`, which is the only way to keep blocking alive when
  # the Flutter engine is not. The plugin's listener also dropped every event
  # whose source node was null, which is most of them, so it could never have
  # reported a block even when it was installed correctly.
  permission_handler: ^11.3.1
  usage_stats: ^2.0.1
  just_audio: ^0.9.41
  # Only for `Blend.harmonize`, which rotates the categorical subject, tier and
  # persona colours into the live theme's temperature.
  material_color_utilities: ^0.13.0

  # Deliberately absent, though the redesign guide listed them: `fl_chart`,
  # `shimmer`, `confetti` and `flutter_animate` are all replaced by hand-written
  # code (the charts, the skeletons, the burst and the motion system), and
  # `hive_flutter`, `sign_in_with_apple`, `riverpod_annotation` and
  # `material_3_expressive` are imported nowhere at all. Declaring a package the
  # app never loads costs build time and widens the supply-chain surface for
  # nothing.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
