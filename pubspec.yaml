name: focusforge
description: "FocusForge — an open-source, privacy-first study companion with app shielding, focus timers, analytics and gamification."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Accounts that survive a reinstall, and the seam for the future
  # study-groups/leaderboard backend (auth profiles only, never usage data).
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  just_audio: ^0.10.6
  confetti: ^0.8.0
  shimmer: ^4.0.0
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
