# F-Droid build metadata for FocusForge — the reference copy.
#
# What actually matters is the file in the F-Droid data repository, at
# metadata/dev.focusforge.focusforge.yml. This copy lives next to the code it
# describes so the two cannot drift.
#
# It builds the `fdroid` branch, which carries no Firebase and no Google Play
# Services; the main branch keeps the Firebase account backend for the Play
# build. That is why `UpdateCheckMode` watches `v*` tags: those are only ever
# pushed on this branch. A `v*` tag on main would point the update check at a
# commit F-Droid cannot build.
#
# The APKs are unsigned in the output paths below on purpose — F-Droid signs
# them with the key it holds for this app, and the release build here is
# configured to succeed without the developer's keystore.
#
# The three builds are the same release split per ABI. Flutter already gives
# each split its own version code — ABI index x 1000 + build number, where
# armeabi-v7a is 1, arm64-v8a is 2 and x86_64 is 4 (3 was the removed x86) —
# so 1.0.1+2 is 1002, 2002 and 4002, and `VercodeOperation` maps the build
# number from the pubspec to the same scheme. `fdroid build` checks the APK
# against the version code in the metadata, so these must agree.
#
# Everything below this line is byte-for-byte what `fdroid rewritemeta` emits
# on the CI machines, which is what the fdroiddata CI checks. Categories are in
# alphabetical order and `commit` is the commit the v1.0.0 tag points at, not
# the tag object.

Categories:
  - System
  - Timer
License: MIT
AuthorName: MufasaXz
AuthorEmail: sudeepyadav7272@gmail.com
SourceCode: https://github.com/MufasaXz/focusforge
IssueTracker: https://github.com/MufasaXz/focusforge/issues

AutoName: FocusForge

RepoType: git
Repo: https://github.com/MufasaXz/focusforge

Builds:
  - versionName: 1.0.1
    versionCode: 1002
    commit: 8cf72aab0ebec13b662375d6a4514dc5d1213331
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.6
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter config --no-analytics
      - flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: r28c

  - versionName: 1.0.1
    versionCode: 2002
    commit: 8cf72aab0ebec13b662375d6a4514dc5d1213331
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.6
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter config --no-analytics
      - flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter build apk --release --split-per-abi --target-platform=android-arm64
    ndk: r28c

  - versionName: 1.0.1
    versionCode: 4002
    commit: 8cf72aab0ebec13b662375d6a4514dc5d1213331
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.6
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter config --no-analytics
      - flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PATH=$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter build apk --release --split-per-abi --target-platform=android-x64
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9].*
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 4002
